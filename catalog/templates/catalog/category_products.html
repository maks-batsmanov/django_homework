{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}

<div class="container mt-5">
    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card" style="width: 18rem;">
                    <img src="{{ product.image|media_filter  }}" class="card-img-top" alt="{{ product.name }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ product.name }}</h5>
                        <p class="card-text">{{ product.description|truncatechars:100 }}</p>
                    </div>
                    <div class="d-flex justify-content-between align-items-center px-2 mb-2 mt-2">
                        <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-primary">Подробнее</a>
                    </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
