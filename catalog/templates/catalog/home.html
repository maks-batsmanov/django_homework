{% extends 'catalog/base.html' %}

{% block content %}


    <main class="container">
        <div class="row text-center">
            {% for product in products %}
            <div class="col-4">
                <div class="card mb-4 box-shadow">
                    <div class="card-header">
                        <h4 class="my-0 font-weight-normal">{{product.name}}</h4>
                    </div>
                    <div class="card-body">
                        <h1 class="card-title pricing-card-title">{{product.price}} руб.</h1>
                        <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                            <li>- {{product.description|truncatechars:100}}</li>

                        </ul>
                        <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-lg btn-block btn-outline-primary">Детали</a>
                    </div>
                </div>
            </div>
            {%endfor%}
        </div>
     </main>



{% endblock %}
