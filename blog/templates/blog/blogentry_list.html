{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}

<div class="container mt-5">
    <div class="row">
        {% for blogentry in blogentry_list %}
        <div class="col-md-4 mb-4">
            <div class="card" style="width: 18rem;">
                <img src="{{ blogentry.preview|media_filter }}" class="card-img-top" alt="{{ blogentry.heading }}">
                <div class="card-body">
                    <h5 class="card-title">{{ blogentry.heading }}</h5>
                    <p class="card-text">{{ blogentry.content|truncatechars:100 }}</p>
                </div>
                <div class="d-flex justify-content-between align-items-center px-2 mb-2 mt-2">
                    <a href="{% url 'blog:detail' blogentry.pk %}" class="btn btn-primary">Читать</a>
                    <p class="card-text"><small class="text-muted">просмотры: {{ blogentry.views }}</small></p>
                </div>
            </div>
        </div>

        {% endfor %}
    </div>
</div>

{% endblock %}
