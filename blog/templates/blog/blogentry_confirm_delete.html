{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}

<h2>Удаление статьи</h2>
<p>Вы действительно хотите удалить статью "{{ entry.heading }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'blog:list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
